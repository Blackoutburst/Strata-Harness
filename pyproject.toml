[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-board-harness"
version = "0.1.0"
description = "Durable supervisor for local-model Board development workers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
strata-board-harness = "strata_board_harness.supervisor:main"

[tool.setuptools.packages.find]
include = ["strata_board_harness*"]
